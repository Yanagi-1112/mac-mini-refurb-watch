name: Check refurbished MacBook Air 13 / Pro 14 (M5+)

on:
  schedule:
    # GitHub側のcronは大きく間引かれる（*/5でも実績は1日4回ほど）ので、これは保険。
    # 本命は外部サーバーのcronからの workflow_dispatch（5分ごと）。詳細は README の注意事項。
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Discordにテスト通知を送る"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test notification
        if: ${{ inputs.test_notify }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "import check; check.notify_discord({'TEST': {'title': '✅ テスト通知：監視は正常に動作しています', 'price': 'M5以降の13インチMacBook Air（32GB/1TBの本命・24GB以上のUS配列）と14インチMacBook Pro（US配列・24GB以上のJIS配列）が出品されたらここに通知が届きます', 'url': 'https://www.apple.com/jp/shop/refurbished/mac'}, 'SAMPLE': {'title': '表示例', 'price': '（表示例）297,800円', 'url': 'https://www.apple.com/jp/shop/refurbished/mac/macbook-air', 'specs': {'model': 'MacBook Air', 'screen': '13インチ', 'chip': 'M5', 'cpu_cores': None, 'gpu_cores': None, 'memory': '32GB', 'storage': '1TB', 'keyboard': 'JIS配列（日本語）', 'color': 'シルバー', 'nano_texture': False}}}, '✅ **テスト通知**')"

      - name: Run checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update state.json"
            git push
          fi
