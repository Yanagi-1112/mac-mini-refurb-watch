name: Check refurbished Mac mini / MacBook Air (US)

on:
  schedule:
    - cron: "*/30 * * * *" # 30分ごと（GitHub側の負荷で数分〜十数分遅れることあり）
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Discordにテスト通知を送る"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test notification
        if: ${{ inputs.test_notify }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "import check; check.notify_discord({'TEST': {'title': '✅ テスト通知：監視は正常に動作しています', 'price': 'Mac mini／USキーボードのMacBook Airが出品されたらここに通知が届きます', 'url': 'https://www.apple.com/jp/shop/refurbished/mac'}}, '✅ **テスト通知**')"

      - name: Run checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update state.json"
            git push
          fi
